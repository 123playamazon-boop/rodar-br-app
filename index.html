<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EASY DR – VEXIS GROUP</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== Tela de login ===== -->
<section id="authView" class="auth">
  <div class="authcard">
    <div class="brand"><img class="logo" src="logo.svg" alt="EASY DR - VEXIS GROUP"><span class="brandname">EASY&nbsp;DR<small>VEXIS GROUP</small></span></div>
    <h1 id="authTitle">Entrar na sua conta</h1>
    <p class="sub" id="authSub">Acesse o seu sistema passo a passo e o painel da oferta.</p>

    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="email" placeholder="voce@email.com">

    <label for="password">Senha</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="mínimo 6 caracteres">

    <button class="big" id="authBtn">Entrar</button>
    <div class="authmsg" id="authMsg"></div>

    <div class="switch" id="authSwitch">
      Ainda não tem conta? <a id="toSignup">Criar conta</a>
    </div>
    <div class="authmode" id="authMode"></div>
  </div>
</section>

<!-- ===== App ===== -->
<section id="appView" class="wrap hidden">
  <div class="appbar">
    <div class="title"><img class="logo" src="logo.svg" alt=""><span class="brandname">EASY&nbsp;DR<small>VEXIS GROUP</small></span></div>
    <div class="who">
      <span id="userEmail"></span>
      <button id="signOut">Sair</button>
    </div>
  </div>
  <div class="modebar" id="modeBar"></div>

  <div class="tabs">
    <button class="tab active" data-tab="guide">Guia passo a passo</button>
    <button class="tab" data-tab="dash">Dashboard</button>
  </div>

  <div id="guideView"></div>
  <div id="dashView" class="hidden"></div>

  <div class="foot">EASY DR – VEXIS GROUP • seus dados ficam salvos na sua conta</div>
</section>

<!-- Supabase JS (carregado da CDN; se offline, app cai em modo local) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js" defer></script>
</body>
</html>
